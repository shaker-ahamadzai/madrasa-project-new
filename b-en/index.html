<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Posts</title>
    <link
      rel="icon"
      type="img/png"
      href="../imgs/ChatGPT Image Apr 20, 2025, 08_56_36 PM.png"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body class="b-body">
    <div class="b-page-container">
      <aside class="sidebar">
        <header class="sidebar__header flex-center">
          <!-- <div class="language-switcher">
            <div class="current-language">
              <span>English</span>
              <i class="fas fa-chevron-down"></i>
            </div>
            <div class="language-dropdown">
              <a href="#" class="language-option">Dari</a>
              <a href="#" class="language-option">English</a>
            </div>
          </div> -->

          <div class="search-container">
            <input type="search" id="search" placeholder="Search posts..." />
            <i class="fas fa-search"></i>
          </div>

          <input type="checkbox" id="sidebar_toggle" class="toggle__checkbox" />
          <label for="sidebar_toggle" class="toggle__button" id="toggle">
            <span class="toggle__icon">&nbsp;</span>
          </label>
        </header>

        <div class="posts-list" id="postsList"></div>
      </aside>

      <main class="b-main-content">
        <div id="postDetails">
          <!-- Post details will be rendered here -->
        </div>
      </main>
    </div>

    <script src="../js/language-switcher.js"></script>
    <script src="../js/blogpost-script.js"></script>
  </body>
</html>
